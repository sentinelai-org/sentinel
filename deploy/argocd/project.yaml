apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sentinel-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Sentinel LLMOps Platform Project
  sourceRepos:
    - '*'
  destinations:
    - namespace: sentinel
      server: https://kubernetes.default.svc
    - namespace: sentinel-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
