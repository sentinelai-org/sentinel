# Local Kubernetes Cluster configuration for Sentinel
# Compatible with kind (Kubernetes in Docker)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sentinel-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      tier: app
  - role: worker
    labels:
      tier: infra
